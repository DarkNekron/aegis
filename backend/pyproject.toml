# Tool configuration only. Dependencies are pinned in requirements*.txt.
[project]
name = "aegis-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: tests that take more than a few seconds"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/F: errors, I: imports, B: bugbear, UP: pyupgrade, S: bandit security checks, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # asserts and dummy secrets are fine in tests

[tool.coverage.run]
source = ["app"]
# The C tracer is blocked by Smart App Control here; sys.monitoring (Python 3.12+) is fast and built in.
core = "sysmon"
